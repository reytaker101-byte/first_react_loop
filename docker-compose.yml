services:
  checkout-nginx:
    image: nginx:alpine
    container_name: checkout-nginx
    ports:
      - "8081:80"
    labels:
      devops.service: "checkout"
      devops.role: "nginx"
      devops.http_port: "8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

  payment-nginx:
    image: nginx:alpine
    container_name: payment-nginx
    ports:
      - "8082:80"
    labels:
      devops.service: "payment"
      devops.role: "nginx"
      devops.http_port: "8082"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
